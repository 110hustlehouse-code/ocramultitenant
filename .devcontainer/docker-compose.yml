services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    # L'app condivide la rete del DB: Postgres risponde su localhost:5432
    network_mode: service:db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ocra
      POSTGRES_PASSWORD: ocra
      POSTGRES_DB: ocra
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocra -d ocra"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
